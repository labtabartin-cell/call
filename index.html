<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>امون</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#070b16;--bg2:#0c1326;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);
  --tx:#eef3ff;--mut:#8b9bc0;--acc:#2dd4bf;--acc2:#38bdf8;--gold:#fbbf24;--gold2:#f59e0b;--red:#fb4b6c;--grn:#22c55e;--vio:#a78bfa;
  --g-acc:linear-gradient(135deg,#2dd4bf,#38bdf8);--g-gold:linear-gradient(135deg,#fde68a,#f59e0b);--g-red:linear-gradient(135deg,#fb7185,#e11d48);--g-grn:linear-gradient(135deg,#4ade80,#16a34a);
  --r:18px;--shadow:0 10px 30px rgba(0,0,0,.35)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.6;overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 85% -10%,#12315a55,transparent 60%),radial-gradient(700px 500px at -10% 110%,#0f3b3a55,transparent 60%),var(--bg);background-attachment:fixed}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
svg.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:13px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.red{color:var(--red)}.grn,.pos{color:var(--grn)}.neg{color:var(--red)}
a{color:var(--acc)}

/* header */
header{display:flex;align-items:center;gap:7px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(7,11,22,.6);border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo em{font-style:normal}
@media(max-width:480px){header.hasline .logo em{display:none}}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;background:var(--g-acc);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--g-acc);display:grid;place-items:center;color:#04201d;box-shadow:0 4px 14px #2dd4bf55}
.logo i svg{width:18px;height:18px;stroke-width:2.2}
.bal{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 8px;font-size:13px;font-weight:800;cursor:pointer;color:var(--gold)}
.bal b{width:20px;height:20px;border-radius:50%;background:var(--g-gold);display:grid;place-items:center;font-size:11px;color:#6b4300;box-shadow:inset 0 -2px 0 #0002}
.lineSel{background:var(--glass);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:7px 8px;font:inherit;font-size:12px;max-width:130px;width:auto;min-width:0}
.ib{background:var(--glass);border:1px solid var(--line);color:var(--tx);border-radius:12px;width:38px;height:38px;cursor:pointer;flex:none;display:grid;place-items:center;transition:.15s}
.ib:active{transform:scale(.92)}
.ib svg{width:19px;height:19px}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 96px;scroll-behavior:smooth}
main>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* floating nav */
nav{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;background:rgba(14,22,42,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:7px 0 5px;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border-radius:16px;transition:.2s}
nav button.on{color:#04201d;background:var(--g-acc);box-shadow:0 6px 18px #2dd4bf44}
nav button svg{width:22px;height:22px}
.dot{position:absolute;top:2px;right:calc(50% - 20px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg2)}

/* surfaces */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:10px;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:10px}
.card.hl{background:linear-gradient(135deg,#2dd4bf1f,#38bdf81a);border-color:#2dd4bf44}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px 14px;font:inherit;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #2dd4bf26}
input::placeholder{color:#6f7fa6}
select option{background:#0c1326}

.btn{background:var(--g-acc);color:#04201d;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;width:100%;text-decoration:none;display:block;text-align:center;box-shadow:0 6px 18px #2dd4bf33;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--glass2);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.btn.red{background:var(--g-red);color:#fff;box-shadow:0 6px 18px #e11d4833}
.btn.gold{background:var(--g-gold);color:#4a2f00;box-shadow:0 6px 18px #f59e0b33}
.btn.sm{width:auto;display:inline-block;padding:7px 13px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default;transform:none}

.seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px;gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 4px;border-radius:12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.seg button.on{background:var(--glass2);color:var(--tx);box-shadow:0 2px 8px #0004}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chip{background:var(--glass);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;transition:.15s}
.chip.on{background:var(--g-gold);color:#4a2f00;border-color:transparent;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.empty:before{content:"";display:block;width:54px;height:54px;margin:0 auto 10px;border-radius:50%;background:var(--glass2);opacity:.7}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--glass2);color:var(--mut)}
.banner{background:linear-gradient(135deg,#0ea5e922,#2dd4bf1a);border:1px solid #38bdf844;border-radius:16px;padding:11px 13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13px}

/* avatars */
.avatar{--h:170;width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 40) 70% 40%));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;text-shadow:0 1px 2px #0005}

/* dial */
.disp{font-size:32px;text-align:center;min-height:62px;letter-spacing:2px;direction:ltr;padding:6px 0;word-break:break-all;font-weight:300}
.disp small{display:block;font-size:13px;color:var(--acc);letter-spacing:0;font-weight:500;min-height:20px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;direction:ltr;max-width:310px;margin:6px auto 14px}
.pad button{aspect-ratio:1;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--tx);font-size:26px;font-weight:300;cursor:pointer;transition:.12s}
.pad button:active{background:var(--glass2);transform:scale(.92)}
.pad .call{background:var(--g-grn);border:0;color:#fff;box-shadow:0 8px 24px #16a34a66}
.pad .call svg{margin:auto;width:28px;height:28px;stroke-width:2.2}
.pad .del{color:var(--mut)}
.pad button:disabled{opacity:.25}

/* chat */
.bubbles{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.bub{max-width:80%;padding:9px 13px;border-radius:18px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-start;background:var(--g-acc);color:#04201d;border-bottom-right-radius:5px}
.bub.th{align-self:flex-end;background:var(--glass2);border-bottom-left-radius:5px}
.bub time{display:block;font-size:10px;opacity:.65;margin-top:2px}

/* market / wallet */
.big{font-size:34px;font-weight:800;background:var(--g-gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.acc{font-size:19px;letter-spacing:2px}
.tier{font-size:11px;padding:2px 10px;border-radius:99px;font-weight:800}
.t-normal{background:#2a3555;color:#b4c1e6}.t-trendy{background:#0f4d49;color:#5eead4}.t-premium{background:#5a3d05;color:#fcd34d}.t-legendary{background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;box-shadow:0 0 14px #db277755}
.num{font-size:19px;font-weight:700;letter-spacing:1px}
.price{color:var(--gold);font-weight:800}
.sw{font-size:12px;border-radius:9px;padding:2px 9px}
.on-b{background:#12392a;color:#4ade80}.off-b{background:#3a2a2a;color:#fca5a5}.lst-b{background:#3b3210;color:#fcd34d}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.code{font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;direction:ltr;background:var(--glass2);border:1px dashed #fbbf2466;border-radius:16px;padding:14px;margin:10px 0;color:var(--gold)}

/* sheet */
#sheetBg{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:30}
#sheetBg.show{display:flex}
#sheet{background:linear-gradient(#111a31,#0c1326);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:22px 18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding-bottom:max(18px,env(safe-area-inset-bottom));animation:up .25s ease}
#sheet:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--glass2);margin:-12px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h3{margin:0 0 8px}

/* call screen */
#callUI{position:fixed;inset:0;background:radial-gradient(600px 500px at 50% 25%,#14507055,transparent 70%),linear-gradient(#070b16,#0d1a33);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px}
#callUI.show{display:flex}
.cavatar{--h:170;position:relative;width:128px;height:128px;border-radius:50%;background:linear-gradient(135deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 40) 70% 38%));display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#fff;margin-bottom:14px;box-shadow:0 12px 40px #0008}
#callUI.ring .cavatar:before,#callUI.ring .cavatar:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #2dd4bf88;animation:wave 1.8s infinite}
#callUI.ring .cavatar:after{animation-delay:.9s}
@keyframes wave{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.cstat{margin:14px 0 36px;font-size:18px;color:var(--acc);min-height:28px;font-variant-numeric:tabular-nums}
.cbtns{display:flex;gap:34px}
.cb{width:72px;height:72px;border-radius:50%;border:0;color:#fff;background:var(--glass2);cursor:pointer;display:grid;place-items:center;transition:.15s;border:1px solid var(--line)}
.cb svg{width:30px;height:30px}
.cb:active{transform:scale(.9)}
.cb.on{background:#fff;color:#000}.cb.r{background:var(--g-red);border:0;box-shadow:0 8px 26px #e11d4866}.cb.g{background:var(--g-grn);border:0;box-shadow:0 8px 26px #16a34a77}
#callUI.ring .cb.g{animation:shake 1s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-12deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(8deg)}}
.cbl{font-size:12px;color:var(--mut);margin-top:8px}

#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(20,30,56,.95);color:var(--tx);border:1px solid var(--line);padding:11px 18px;border-radius:99px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center;box-shadow:var(--shadow);backdrop-filter:blur(10px)}

/* auth */
.auth{padding:30px 22px;display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%;max-width:420px;margin:0 auto}
.auth .hero{width:84px;height:84px;margin:0 auto;border-radius:28px;background:var(--g-acc);display:grid;place-items:center;color:#04201d;box-shadow:0 14px 40px #2dd4bf55}
.auth .hero svg{width:44px;height:44px;stroke-width:2.1}
.auth h1{margin:0;text-align:center;font-size:30px;background:var(--g-acc);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== games ===== */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:17px}
.bar{height:10px;background:var(--glass2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .25s}
.bar.en i{background:linear-gradient(90deg,#38bdf8,#2dd4bf)}.bar.cp i{background:var(--g-gold)}
.coinwrap{display:grid;place-items:center;padding:14px 0 10px;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#tapCoin{width:210px;height:210px;border-radius:50%;border:0;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 28%,#fff6c2 0,#fcd34d 28%,#f59e0b 62%,#b45309 100%);box-shadow:0 0 0 10px #fbbf2422,0 0 0 22px #fbbf2412,0 18px 50px #f59e0b55,inset 0 -10px 22px #7c2d1255,inset 0 8px 16px #fff8;transition:transform .06s;display:grid;place-items:center;color:#7c4a03}
#tapCoin:before{content:"";position:absolute;inset:16px;border-radius:50%;border:3px solid #b4530955;box-shadow:inset 0 2px 6px #fff6}
#tapCoin.press{transform:scale(.94)}
#tapCoin.dead{filter:grayscale(.85) brightness(.7)}
#tapCoin span{font-size:78px;font-weight:900;text-shadow:0 2px 0 #fff7;pointer-events:none}
.fl{position:absolute;font-weight:900;font-size:22px;color:var(--gold);pointer-events:none;animation:fly .9s ease-out forwards;text-shadow:0 2px 8px #000a}
@keyframes fly{to{transform:translateY(-90px);opacity:0}}
.pip{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--glass2);margin-left:2px}.pip.f{background:var(--acc)}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.gc .em{font-size:30px}
.gc .btn{margin-top:auto}
.wheelbox{position:relative;width:272px;height:272px;margin:10px auto 18px}
#wheel{width:100%;height:100%;border-radius:50%;border:6px solid #fbbf24;box-shadow:0 0 0 6px #fbbf2422,0 14px 40px #0008;position:relative;transition:transform 4.2s cubic-bezier(.12,.7,.1,1);background:conic-gradient(#2dd4bf 0 60deg,#38bdf8 60deg 120deg,#a78bfa 120deg 180deg,#f472b6 180deg 240deg,#fb923c 240deg 300deg,#facc15 300deg 360deg)}
#wheel .lb{position:absolute;left:50%;top:50%;width:0;height:0;font-weight:900;font-size:19px;color:#0b1220}
#wheel .lb span{position:absolute;left:-28px;top:-118px;width:56px;text-align:center}
.hub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--bg2);border:4px solid #fbbf24;z-index:2;display:grid;place-items:center;font-size:20px}
.ptr{position:absolute;left:50%;top:-14px;margin-left:-14px;width:28px;height:34px;z-index:3;background:var(--red);clip-path:polygon(50% 100%,0 0,100% 0);filter:drop-shadow(0 4px 6px #0008)}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.box{aspect-ratio:1;border-radius:22px;border:1px solid var(--line);background:var(--glass);font-size:54px;cursor:pointer;transition:.2s;display:grid;place-items:center}
.box:active{transform:scale(.93)}
.box.win{background:linear-gradient(135deg,#fde68a44,#f59e0b33);border-color:#fbbf24;box-shadow:0 0 30px #fbbf2455}
.box.lose{opacity:.5}
.box.pick{outline:3px solid var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetBg"><div id="sheet"></div></div>
<div id="callUI"></div>
<div id="toast"></div>
<audio id="remoteAudio" autoplay playsinline></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script src="games.js"></script>
<script src="bank.js"></script>
</body>
</html>
