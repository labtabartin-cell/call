<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>امون</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--line:#243253;--tx:#e8eefc;--mut:#8fa0c4;--acc:#2dd4bf;--gold:#f5b942;--red:#f43f5e;--grn:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
header .logo{font-weight:800;font-size:18px;color:var(--acc)}
.grow{flex:1;min-width:0}
.bal{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--gold);cursor:pointer}
.lineSel{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 8px;font:inherit;font-size:12px;max-width:140px;width:auto}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer;flex:none}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .i{font-size:20px}nav button.on{color:var(--acc)}
.dot{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#04201d;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%;text-decoration:none;display:block;text-align:center}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.gold{background:var(--gold);color:#2b1c00}
.btn.sm{width:auto;display:inline-block;padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px 4px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx)}
.disp{font-size:28px;text-align:center;min-height:48px;letter-spacing:1px;direction:ltr;padding:6px 0;word-break:break-all}
.disp small{display:block;font-size:12px;color:var(--mut);letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;max-width:320px;margin:6px auto 12px}
.pad button{height:60px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:23px;cursor:pointer}
.pad button:active{background:var(--card2)}
.pad .call{background:var(--grn);border:0;color:#fff;font-size:25px}
.pad .del{font-size:20px;color:var(--mut)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--acc);flex:none}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.red{color:var(--red)}.grn,.pos{color:var(--grn)}.neg{color:var(--red)}
.bubbles{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.bub{max-width:80%;padding:8px 12px;border-radius:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-start;background:var(--acc);color:#04201d;border-bottom-right-radius:4px}
.bub.th{align-self:flex-end;background:var(--card2);border-bottom-left-radius:4px}
.bub time{display:block;font-size:10px;opacity:.65;margin-top:2px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
a{color:var(--acc)}
.big{font-size:30px;font-weight:800;color:var(--gold)}
.acc{font-size:19px;letter-spacing:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gold);color:#2b1c00;border-color:var(--gold);font-weight:700}
.tier{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700}
.t-normal{background:#2a3555;color:#aab8dd}.t-trendy{background:#0f4d49;color:#5eead4}.t-premium{background:#5a3d05;color:#fcd34d}.t-legendary{background:linear-gradient(90deg,#6d28d9,#db2777);color:#fff}
.num{font-size:19px;font-weight:700;letter-spacing:1px}
.price{color:var(--gold);font-weight:800}
.sw{font-size:12px;border-radius:8px;padding:2px 8px}
.on-b{background:#12392a;color:#4ade80}.off-b{background:#3a2a2a;color:#fca5a5}.lst-b{background:#3b3210;color:#fcd34d}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.banner{background:#16324a;border:1px solid #1f5a86;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13px}
#sheetBg{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:30}
#sheetBg.show{display:flex}
#sheet{background:var(--card);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding-bottom:max(18px,env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 8px}
.code{font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;direction:ltr;background:var(--card2);border-radius:14px;padding:14px;margin:10px 0;color:var(--gold)}
#callUI{position:fixed;inset:0;background:linear-gradient(#0b1220,#101a33);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px}
#callUI.show{display:flex}
.cavatar{width:110px;height:110px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--acc);margin-bottom:12px}
.cstat{margin:14px 0 30px;font-size:18px;color:var(--acc);min-height:28px}
.cbtns{display:flex;gap:26px}
.cb{width:68px;height:68px;border-radius:50%;border:0;font-size:26px;cursor:pointer;color:#fff;background:var(--card2)}
.cb.on{background:#fff;color:#000}.cb.r{background:var(--red)}.cb.g{background:var(--grn)}
.cbl{font-size:12px;color:var(--mut);margin-top:6px}
@keyframes pulse{0%{box-shadow:0 0 0 0 #2dd4bf66}100%{box-shadow:0 0 0 26px #2dd4bf00}}
#callUI.ring .cavatar{animation:pulse 1.2s infinite}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}
.auth{padding:30px 20px;display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%;max-width:420px;margin:0 auto}
.auth h1{margin:0;color:var(--acc);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetBg"><div id="sheet"></div></div>
<div id="callUI"></div>
<div id="toast"></div>
<audio id="remoteAudio" autoplay playsinline></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
