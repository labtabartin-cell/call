<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>بازار امون</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--line:#243253;--tx:#e8eefc;--mut:#8fa0c4;--acc:#f5b942;--acc2:#2dd4bf;--red:#f43f5e;--grn:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);padding-top:max(12px,env(safe-area-inset-top))}
header .logo{font-weight:800;font-size:17px;color:var(--acc)}
.grow{flex:1;min-width:0}
.bal{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--acc)}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;width:38px;height:38px;font-size:17px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 8px;font:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:13px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:#2b1c00;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.g{background:var(--acc2);color:#04201d}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}
.big{font-size:30px;font-weight:800;color:var(--acc)}
.acc{font-size:19px;letter-spacing:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);color:#2b1c00;border-color:var(--acc);font-weight:700}
.tier{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700}
.t-normal{background:#2a3555;color:#aab8dd}.t-trendy{background:#0f4d49;color:#5eead4}
.t-premium{background:#5a3d05;color:#fcd34d}.t-legendary{background:linear-gradient(90deg,#6d28d9,#db2777);color:#fff}
.num{font-size:19px;font-weight:700;letter-spacing:1px}
.price{color:var(--acc);font-weight:800}
.sw{font-size:12px;border-radius:8px;padding:2px 8px}
.on-b{background:#12392a;color:#4ade80}.off-b{background:#3a2a2a;color:#fca5a5}.lst-b{background:#3b3210;color:#fcd34d}
.seg{display:flex;gap:8px;margin-bottom:10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#sheetBg{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:30}
#sheetBg.show{display:flex}
#sheet{background:var(--card);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding-bottom:max(18px,env(safe-area-inset-bottom))}
#sheet h3{margin:0 0 8px}
.code{font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;direction:ltr;background:var(--card2);border-radius:14px;padding:14px;margin:10px 0;color:var(--acc)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}
.auth{padding:30px 20px;display:flex;flex-direction:column;gap:12px;justify-content:center;height:100%}
.auth h1{margin:0;color:var(--acc);text-align:center}
.tabs2{display:flex;background:var(--card);border-radius:12px;padding:4px}
.tabs2 button{flex:1;background:none;border:0;color:var(--mut);padding:9px;border-radius:9px;font:inherit;cursor:pointer}
.tabs2 button.on{background:var(--card2);color:var(--tx)}
a{color:var(--acc2)}
.pos{color:var(--grn)}.neg{color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetBg"><div id="sheet"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SB_URL = 'https://pqfeqweoxpqrrnlmngmd.supabase.co';
const SB_KEY = 'sb_publishable_ef-EOvmOOispUBMlv9Esfw_R6cFIBPB';
const CALL_URL = 'amoon-call.html';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum = n => String(n).replace(/^(\d{4})(\d{3})(\d{4})$/, '$1 $2 $3');
const money = n => Number(n).toLocaleString('fa-IR');
const isNum = n => /^08\d{9}$/.test(n);
const TIER = { normal:'معمولی', trendy:'رند', premium:'ویژه', legendary:'افسانه‌ای' };
const ERR = {
  not_authenticated:'ابتدا وارد شوید', insufficient_funds:'موجودی کیف پول کافی نیست', number_not_available:'این شماره دیگر موجود نیست',
  invalid_number:'شماره نامعتبر است (۰۸ + ۹ رقم)', not_owner:'این شماره مال شما نیست', already_listed:'این شماره قبلاً در ویترین گذاشته شده',
  listing_unavailable:'این آگهی دیگر فعال نیست', cannot_buy_own:'نمی‌توانید شماره خودتان را بخرید', account_not_found:'شماره حساب پیدا نشد',
  cannot_transfer_to_self:'انتقال به حساب خودتان ممکن نیست', invalid_amount:'مبلغ نامعتبر است', username_taken:'این نام کاربری قبلاً گرفته شده',
  invalid_username:'نام کاربری: ۳ تا ۲۰ حرف انگلیسی کوچک/عدد/_', invalid_password:'رمز عبور حداقل ۶ نویسه باشد',
  'Invalid login credentials':'نام کاربری یا رمز عبور اشتباه است', signup_failed:'ثبت‌نام انجام نشد'
};
const errText = e => ERR[String(e?.message || e || '').trim()] || (e?.message || 'خطا');
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',3500); }
const dtm = d => new Date(d).toLocaleString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});

const S = { user:null, tab:'wallet', wallet:null, tx:[], shop:[], shopTier:'all', shopSort:'asc', shopLimit:30, mine:[], mineListings:{}, listings:[], showCode:{} };
let authMode = 'login', giftT = null;

(async function(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) await boot(session.user); else renderAuth();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { S.user = null; renderAuth(); } });
})();
async function boot(user){ S.user = user; await loadAll(); render(); }
async function loadAll(){ await Promise.all([loadWallet(), loadShop(), loadMine(), loadListings()]); }

async function loadWallet(){
  const { data:w } = await sb.from('wallets').select('*').maybeSingle(); S.wallet = w;
  const { data:tx } = await sb.from('wallet_tx').select('*').order('id',{ascending:false}).limit(30); S.tx = tx || [];
}
async function loadShop(){
  let q = sb.from('numbers').select('id,number,tier,base_price').eq('status','available');
  if (S.shopTier !== 'all') q = q.eq('tier', S.shopTier);
  const { data } = await q.order('base_price', { ascending: S.shopSort === 'asc' }).limit(S.shopLimit + 1);
  S.shop = data || [];
}
async function loadMine(){
  const { data } = await sb.from('numbers').select('id,number,tier,points,status,active_user_id,base_price,number_secrets(activation_code)').eq('owner_id', S.user.id).order('created_at', { ascending:false });
  S.mine = data || [];
  const { data:ls } = await sb.from('listings').select('id,number_id,price').eq('seller_id', S.user.id).eq('status','active');
  S.mineListings = Object.fromEntries((ls || []).map(l => [l.number_id, l]));
}
async function loadListings(){
  const { data } = await sb.from('listings').select('id,price,seller_id,numbers(number,tier,points)').eq('status','active').order('price');
  S.listings = data || [];
}

/* ---------- auth ---------- */
function renderAuth(){
  $('#app').innerHTML = `<div class="auth"><h1>🛒 بازار امون</h1>
    <div class="mut" style="text-align:center">خرید و فروش شماره‌های ۰۸ · کیف پول امون‌کوین (آزمایشی)</div>
    <div class="tabs2"><button data-act="authMode" data-m="login" class="${authMode==='login'?'on':''}">ورود</button><button data-act="authMode" data-m="register" class="${authMode==='register'?'on':''}">ثبت‌نام</button></div>
    <form data-form="auth" style="display:flex;flex-direction:column;gap:10px">
      <input name="u" placeholder="نام کاربری (انگلیسی)" autocapitalize="off" dir="ltr" required>
      <input name="p" type="password" placeholder="رمز عبور" dir="ltr" required>
      <button class="btn">${authMode==='login'?'ورود':'ساخت حساب (۲٬۰۰۰ سکه هدیه)'}</button></form>
    <div class="mut" style="text-align:center">همین حساب در <a href="${CALL_URL}">اپ امون تماس</a> هم کار می‌کند.</div></div>`;
}
async function doAuth(u, p){
  u = u.trim().toLowerCase();
  try {
    if (authMode === 'register') {
      const r = await fetch(`${SB_URL}/functions/v1/register`, { method:'POST', headers:{'Content-Type':'application/json', apikey:SB_KEY}, body:JSON.stringify({username:u, password:p}) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || 'signup_failed');
    }
    const { data, error } = await sb.auth.signInWithPassword({ email:`${u}@amoon.app`, password:p });
    if (error) throw error; await boot(data.user);
  } catch (e) { toast(errText(e)); }
}

/* ---------- views ---------- */
const TABS = [['wallet','👛','کیف پول'],['shop','🔢','خرید شماره'],['mine','📱','شماره‌های من'],['market','🏪','ویترین']];
function render(){
  if (!S.user) return renderAuth();
  const v = { wallet:viewWallet, shop:viewShop, mine:viewMine, market:viewMarket }[S.tab]();
  $('#app').innerHTML = `<header><span class="logo">بازار امون</span><span class="grow"></span>
    <span class="bal">🪙 ${money(S.wallet?.balance ?? 0)}</span><a class="ib" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="${CALL_URL}" title="اپ تماس">📞</a>
    <button class="ib" data-act="logout" title="خروج">⎋</button></header>
    <main id="main">${v}</main>
    <nav>${TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-act="tab" data-t="${t[0]}"><span class="i">${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;
  if (S.tab === 'wallet') startGiftTimer();
}
const tierTag = t => `<span class="tier t-${t}">${TIER[t]}</span>`;

function viewWallet(){
  const w = S.wallet; if (!w) return '<div class="empty">کیف پول پیدا نشد</div>';
  const acc = w.account_no.replace(/(\d{4})(?=\d)/g, '$1 ');
  const KIND = { welcome:'هدیه خوش‌آمدگویی', gift:'هدیه روزانه', topup:'شارژ کیف پول', transfer:'انتقال', number_purchase:'خرید شماره', number_sale:'فروش شماره', market_fee:'کارمزد بازار' };
  return `<div class="card"><div class="mut">موجودی</div><div class="big">🪙 ${money(w.balance)}</div>
      <div class="mut" style="margin-top:8px">شماره حساب شما (برای دریافت پول)</div>
      <div class="row"><div class="acc ltr grow">${acc}</div><button class="btn sm sec" data-act="copyAcc">کپی</button></div></div>
    <div class="card"><div class="row"><div class="grow"><b>🎁 هدیه روزانه</b><div class="mut" id="giftInfo"></div></div><button class="btn sm g" id="giftBtn" data-act="gift">دریافت ۱۵۰ سکه</button></div></div>
    <div class="card"><b>شارژ کیف پول</b> <span class="mut">(سکه آزمایشی، بدون پرداخت واقعی)</span>
      <div class="qa">${[1000,5000,20000,100000].map(a=>`<button class="chip" data-act="topup" data-a="${a}">+${money(a)}</button>`).join('')}</div>
      <form data-form="topup" class="row"><input name="a" type="number" min="1" max="1000000" placeholder="مبلغ دلخواه (حداکثر ۱٬۰۰۰٬۰۰۰)" dir="ltr"><button class="btn sm" style="height:44px">شارژ</button></form></div>
    <div class="card"><b>انتقال پول به کیف پول دیگر</b>
      <form data-form="transfer" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <input name="acc" inputmode="numeric" maxlength="14" placeholder="شماره حساب مقصد (۱۲ رقم)" dir="ltr" required>
        <input name="a" type="number" min="1" placeholder="مبلغ" dir="ltr" required>
        <input name="m" maxlength="100" placeholder="توضیح (اختیاری)"><button class="btn">انتقال</button></form></div>
    <b>تراکنش‌ها</b><div style="height:8px"></div>` +
    (S.tx.length ? S.tx.map(t=>{ const inn = t.to_wallet === w.id && t.from_wallet !== w.id;
      return `<div class="card row"><div class="grow"><div>${KIND[t.kind]||t.kind}${t.memo && !['welcome','gift','topup'].includes(t.kind) ? ' <span class="mut ltr">'+esc(t.memo)+'</span>' : ''}</div><div class="mut">${dtm(t.created_at)}</div></div>
        <b class="${inn?'pos':'neg'}">${inn?'+':'−'}${money(t.amount)}</b></div>`; }).join('') : '<div class="empty">تراکنشی نیست</div>');
}
function startGiftTimer(){
  clearInterval(giftT);
  const tick = () => {
    const info = $('#giftInfo'), btn = $('#giftBtn'); if (!info) return clearInterval(giftT);
    const last = S.wallet?.last_gift_at ? new Date(S.wallet.last_gift_at).getTime() : 0, left = last + 864e5 - Date.now();
    if (left > 0) { const h = Math.floor(left/36e5), m = Math.floor(left%36e5/6e4), s = Math.floor(left%6e4/1e3);
      info.textContent = `هدیه بعدی تا ${h} ساعت و ${m} دقیقه و ${s} ثانیه دیگر`; btn.disabled = true; }
    else { info.textContent = 'هدیه امروز آماده است!'; btn.disabled = false; }
  }; tick(); giftT = setInterval(tick, 1000);
}

function viewShop(){
  const more = S.shop.length > S.shopLimit, items = S.shop.slice(0, S.shopLimit);
  return `<div class="card"><b>🎯 شماره دلخواه</b><div class="mut">شماره‌ای که می‌خواهید را بنویسید؛ قیمت بر اساس رند بودن محاسبه می‌شود.</div>
      <input id="custom" inputmode="numeric" maxlength="11" placeholder="08xxxxxxxxx" dir="ltr" style="margin-top:8px"><div id="quote" style="margin-top:8px"></div></div>
    <div class="chips">${[['all','همه']].concat(Object.entries(TIER)).map(([k,v])=>`<button class="chip ${S.shopTier===k?'on':''}" data-act="shopTier" data-t="${k}">${v}</button>`).join('')}
      <button class="chip" data-act="shopSort">${S.shopSort==='asc'?'⬆ ارزان‌ترین':'⬇ گران‌ترین'}</button></div>` +
    (items.length ? items.map(n=>`<div class="card row"><div class="grow"><div class="num ltr">${fmtNum(n.number)}</div>${tierTag(n.tier)}</div>
      <div class="price">🪙 ${money(n.base_price)}</div><button class="btn sm" data-act="buy" data-n="${n.number}" data-p="${n.base_price}">خرید</button></div>`).join('') : '<div class="empty">شماره‌ای با این فیلتر موجود نیست</div>') +
    (more ? '<button class="btn sec" data-act="moreShop">نمایش بیشتر</button>' : '');
}

function viewMine(){
  return `<div class="mut" style="margin-bottom:10px">برای فعال‌سازی، در اپ تماس <b class="ltr">#26*</b> را شماره‌گیری کنید و شماره و کد فعال‌سازی را وارد کنید.</div>` +
  (S.mine.length ? S.mine.map(n=>{
    const code = n.number_secrets?.activation_code, ls = S.mineListings[n.id], shown = S.showCode[n.id];
    const badge = n.status==='listed' ? '<span class="sw lst-b">در ویترین</span>' : (n.active_user_id ? '<span class="sw on-b">فعال</span>' : '<span class="sw off-b">غیرفعال</span>');
    return `<div class="card"><div class="row"><div class="grow"><div class="num ltr">${fmtNum(n.number)}</div>${tierTag(n.tier)} ${badge}</div></div>
      <div class="row" style="margin-top:8px"><div class="grow mut">کد فعال‌سازی: <b class="ltr" style="color:var(--tx);letter-spacing:3px">${shown ? esc(code) : '••••••'}</b></div>
        <button class="btn sm sec" data-act="toggleCode" data-id="${n.id}">${shown?'پنهان':'نمایش'}</button></div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">${n.status==='listed'
        ? `<span class="mut grow">قیمت ویترین: 🪙 ${money(ls?.price ?? 0)}</span><button class="btn sm red" data-act="cancelList" data-id="${ls?.id}">لغو فروش</button>`
        : `<button class="btn sm g" data-act="sell" data-id="${n.id}" data-n="${n.number}">فروش در ویترین</button><button class="btn sm sec" data-act="rotate" data-id="${n.id}">کد جدید</button>`}</div></div>`;
  }).join('') : '<div class="empty">هنوز شماره‌ای ندارید. از «خرید شماره» یکی بگیرید.</div>');
}

function viewMarket(){
  return `<div class="mut" style="margin-bottom:10px">شماره‌های دست‌دوم؛ قیمت را برنامه خودش تعیین می‌کند. با خرید، کد فعال‌سازی قبلی باطل و کد جدید برای شما صادر می‌شود.</div>` +
  (S.listings.length ? S.listings.map(l=>{ const mineL = l.seller_id === S.user.id;
    return `<div class="card row"><div class="grow"><div class="num ltr">${fmtNum(l.numbers.number)}</div>${tierTag(l.numbers.tier)}${mineL?' <span class="sw lst-b">آگهی شما</span>':''}</div>
      <div class="price">🪙 ${money(l.price)}</div>${mineL ? '' : `<button class="btn sm" data-act="buyList" data-id="${l.id}" data-n="${l.numbers.number}" data-p="${l.price}">خرید</button>`}</div>`; }).join('')
   : '<div class="empty">فعلاً شماره دست‌دومی در ویترین نیست</div>');
}

/* ---------- sheet ---------- */
function sheet(h){ $('#sheet').innerHTML = h; $('#sheetBg').classList.add('show'); }
function closeSheet(){ $('#sheetBg').classList.remove('show'); }
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
function codeSheet(r){
  sheet(`<h3>🎉 شماره مال شماست</h3><div class="num ltr" style="text-align:center">${fmtNum(r.number)}</div><div class="mut" style="text-align:center">کد فعال‌سازی</div>
    <div class="code">${esc(r.activation_code)}</div>
    <div class="mut">در اپ تماس <b class="ltr">#26*</b> را شماره‌گیری کنید، شماره خریداری‌شده و سپس این کد را وارد کنید. بعد از آن تماس‌ها و پیامک‌های این شماره برای شما می‌آید.</div>
    <div style="height:12px"></div><a class="btn g" style="display:block;text-align:center;text-decoration:none" href="${CALL_URL}">رفتن به اپ تماس</a>
    <button class="btn sec" style="margin-top:8px" data-act="closeSheet">بستن</button>`);
}

/* ---------- actions ---------- */
async function refresh(){ await loadAll(); render(); }
async function rpc(fn, args){ const { data, error } = await sb.rpc(fn, args); if (error) { toast(errText(error)); return null; } return data; }

const H = {
  authMode: d => { authMode = d.m; renderAuth(); },
  tab: async d => { S.tab = d.t; render(); if (d.t==='shop') { await loadShop(); render(); } else if (d.t==='market') { await loadListings(); render(); } else if (d.t==='mine') { await loadMine(); render(); } },
  logout: () => sb.auth.signOut(),
  closeSheet,
  copyAcc: () => { navigator.clipboard?.writeText(S.wallet.account_no).then(() => toast('شماره حساب کپی شد')); },
  gift: async () => { const r = await rpc('claim_daily_gift'); if (!r) return; if (r.ok) toast('🎁 ۱۵۰ سکه به کیف پول اضافه شد'); await loadWallet(); render(); },
  topup: async d => { const r = await rpc('topup_wallet', { p_amount:+d.a }); if (r) { toast('کیف پول شارژ شد'); await loadWallet(); render(); } },
  shopTier: async d => { S.shopTier = d.t; S.shopLimit = 30; await loadShop(); render(); },
  shopSort: async () => { S.shopSort = S.shopSort==='asc' ? 'desc' : 'asc'; await loadShop(); render(); },
  moreShop: async () => { S.shopLimit += 30; await loadShop(); render(); },
  buy: async d => { if (!confirm(`خرید شماره ${fmtNum(d.n)} به قیمت ${money(d.p)} سکه؟`)) return; await doBuy(d.n); },
  buyCustom: async d => { if (!confirm(`خرید شماره ${fmtNum(d.n)} به قیمت ${money(d.p)} سکه؟`)) return; await doBuy(d.n); },
  buyList: async d => {
    if (!confirm(`خرید شماره ${fmtNum(d.n)} به قیمت ${money(d.p)} سکه؟`)) return;
    const r = await rpc('buy_listing', { p_listing_id:d.id }); if (!r) return; await refresh(); codeSheet(r);
  },
  toggleCode: d => { S.showCode[d.id] = !S.showCode[d.id]; render(); },
  sell: async d => {
    const est = await rpc('quote_number', { p_number:d.n }); if (!est) return;
    if (!confirm(`شماره ${fmtNum(d.n)} با قیمت خودکار ${money(est.price)} سکه در ویترین گذاشته شود؟\nکارمزد بازار ۵٪ است. با فروش، کد فعال‌سازی فعلی باطل می‌شود.`)) return;
    const r = await rpc('list_number_for_sale', { p_number_id:d.id }); if (r) { toast('شماره در ویترین قرار گرفت'); await refresh(); }
  },
  cancelList: async d => { const r = await rpc('cancel_listing', { p_listing_id:d.id }); if (r) { toast('فروش لغو شد'); await refresh(); } },
  rotate: async d => {
    if (!confirm('کد جدید ساخته شود؟ شماره از همه دستگاه‌ها غیرفعال می‌شود و باید دوباره با کد جدید فعال شود.')) return;
    const r = await rpc('rotate_code', { p_number_id:d.id }); if (!r) return;
    S.showCode[d.id] = true; await loadMine(); render(); toast('کد جدید ساخته شد');
  }
};
async function doBuy(num){
  const r = await rpc('buy_number', { p_number:num }); if (!r) { await loadShop(); return render(); }
  await refresh(); codeSheet(r);
}
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && H[t.dataset.act]) H[t.dataset.act](t.dataset, t); });

let qT;
document.addEventListener('input', e => {
  if (e.target.id !== 'custom') return;
  const v = e.target.value.replace(/\D/g, ''); e.target.value = v; const box = $('#quote'); clearTimeout(qT);
  if (v.length < 11) { box.innerHTML = v.length ? '<span class="mut">شماره باید ۱۱ رقم و با ۰۸ شروع شود</span>' : ''; return; }
  qT = setTimeout(async () => {
    const q = await rpc('quote_number', { p_number:v }); if (!q) return;
    if (!q.valid) { box.innerHTML = '<span class="neg">شماره نامعتبر است؛ باید با ۰۸ شروع شود</span>'; return; }
    const head = `<div class="row"><div class="grow"><div class="num ltr">${fmtNum(v)}</div>${tierTag(q.tier)}</div>`;
    if (q.state === 'taken') box.innerHTML = head + '<span class="neg">قبلاً فروخته شده</span></div>';
    else if (q.state === 'listed') box.innerHTML = head + `<div class="price">🪙 ${money(q.price)}</div><button class="btn sm" data-act="buyList" data-id="${q.listing_id}" data-n="${v}" data-p="${q.price}">خرید دست‌دوم</button></div>`;
    else box.innerHTML = head + `<div class="price">🪙 ${money(q.price)}</div><button class="btn sm" data-act="buyCustom" data-n="${v}" data-p="${q.price}">خرید</button></div>`;
  }, 250);
});

document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f)), k = f.dataset.form;
  if (k === 'auth') return doAuth(v.u, v.p);
  if (k === 'topup') { const a = Math.floor(+v.a); if (!(a >= 1)) return toast('مبلغ را وارد کنید'); const r = await rpc('topup_wallet', { p_amount:a }); if (r) { toast('کیف پول شارژ شد'); await loadWallet(); render(); } return; }
  if (k === 'transfer') {
    const acc = v.acc.replace(/\D/g, ''), a = Math.floor(+v.a);
    if (acc.length !== 12) return toast('شماره حساب ۱۲ رقم است'); if (!(a >= 1)) return toast('مبلغ را وارد کنید');
    const who = await rpc('resolve_account', { p_account:acc }); if (!who) return;
    if (!who.found) return toast('شماره حساب پیدا نشد');
    if (!confirm(`انتقال ${money(a)} سکه به «${who.username}»؟`)) return;
    const r = await rpc('transfer_wallet', { p_to_account:acc, p_amount:a, p_memo:v.m || null });
    if (r) { toast('✅ انتقال انجام شد'); await loadWallet(); render(); }
  }
});
</script>
</body>
